---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  phpunit:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@0f680c6c2bceb03810384e86a70ba10a2ed90de8 # v2.0.5
    with:
      composer-command: require yiisoft/yii2:22.0.x-dev
      hook: npm ci --ignore-scripts
      concurrency-group: phpunit-${{ github.workflow }}-${{ github.ref }}
      ignore-platform-reqs-php-version: "[8.6]"
      extensions: bcmath, dom, intl, mbstring, openssl, sodium
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  phpunit-compatibility:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@0f680c6c2bceb03810384e86a70ba10a2ed90de8 # v2.0.5
    with:
      composer-command: require yiisoft/yii2:2.0.55
      concurrency-group: phpunit-compatibility-${{ github.workflow }}-${{ github.ref }}
      ignore-platform-reqs-php-version: "[8.6]"
      extensions: bcmath, dom, intl, mbstring, openssl, sodium
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
