---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: assets

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: assets-${{ github.workflow }}-${{ github.ref }}

jobs:
  javascript:
    name: JavaScript build, browser tests, coverage and mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - run: npm run check:assets
      - run: npx playwright install --with-deps --only-shell chromium firefox webkit
      - env:
          TIME_PICKER_BROWSERS: chromium firefox webkit
        run: npm test
      - run: npm run coverage
      - if: ${{ !cancelled() }}
        run: npm run mutation
