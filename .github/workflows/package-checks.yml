---
name: package-checks

on:
  pull_request: &ignore-paths
    paths-ignore:
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

permissions:
  contents: read

concurrency:
  group: package-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: Installed package E2E
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - yii: "2.0.55"
            dependencies: highest
          - yii: "2.0.55"
            dependencies: lowest
          - yii: "22.0.x-dev"
            dependencies: highest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: dom, mbstring, zip
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps --only-shell chromium firefox webkit
      - name: Verify published assets, popup, ActiveForm, PJAX and POST
        env:
          TIME_PICKER_BROWSERS: chromium firefox webkit
          YII_REQUIREMENT: ${{ matrix.yii }}
          TIME_PICKER_DEPENDENCIES: ${{ matrix.dependencies }}
        run: bash scripts/verify-consumer.sh "$YII_REQUIREMENT"
