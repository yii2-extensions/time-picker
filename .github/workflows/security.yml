---
on:
  - pull_request
  - push

name: security

permissions:
  contents: read

jobs:
  security:
    uses: yii2-framework/actions/.github/workflows/security.yml@0f680c6c2bceb03810384e86a70ba10a2ed90de8 # v2.0.5
    permissions:
      contents: read
    with:
      gitleaks-config: .github/linters/.gitleaks.toml
      ignore-platform-reqs-php-version: "[8.6]"
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
