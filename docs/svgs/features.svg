<svg viewBox="0 0 1200 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="features-title features-description">
    <title id="features-title">TimePicker features</title>
    <desc id="features-description">Yii2 form integration, Bootstrap 3 through 5, configurable time formats and layouts, Krajee integration, and bundled assets.</desc>
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 16px; fill: #1a202c; }
        .content { font-size: 13px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="20" y="20" width="570" height="100" rx="6"/>
        <rect x="20" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="50">Form Integration</text>
        <text class="content" x="40" y="78">Standalone inputs and model attributes</text>
        <text class="content" x="40" y="98">Use directly or through ActiveForm</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="20" width="570" height="100" rx="6"/>
        <rect x="610" y="20" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="50">Bootstrap 3, 4 and 5</text>
        <text class="content" x="630" y="78">Version-specific markup and Yii asset bundles</text>
        <text class="content" x="630" y="98">Configure matching bsVersion settings and icons</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="140" width="570" height="100" rx="6"/>
        <rect x="20" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="170">Flexible Time Formats</text>
        <text class="content" x="40" y="198">12-hour or 24-hour display with optional seconds</text>
        <text class="content" x="40" y="218">Set minute steps and default times</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="140" width="570" height="100" rx="6"/>
        <rect x="610" y="140" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="170">Configurable Layouts</text>
        <text class="content" x="630" y="198">Custom addons, buttons and input sizes</text>
        <text class="content" x="630" y="218">Dropdown and inline input layouts</text>
    </g>

    <g>
        <rect class="box-bg" x="20" y="260" width="570" height="100" rx="6"/>
        <rect x="20" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="40" y="290">Krajee Integration</text>
        <text class="content" x="40" y="318">Plugin options, events, disabled and readonly</text>
        <text class="content" x="40" y="338">Inherited input and asset configuration</text>
    </g>

    <g>
        <rect class="box-bg" x="610" y="260" width="570" height="100" rx="6"/>
        <rect x="610" y="260" width="4" height="100" fill="#1f883d"/>
        <text class="title" x="630" y="290">Bundled Assets</text>
        <text class="content" x="630" y="318">JavaScript and CSS shipped with the extension</text>
        <text class="content" x="630" y="338">Debug and minified files with asset overrides</text>
    </g>
</svg>
