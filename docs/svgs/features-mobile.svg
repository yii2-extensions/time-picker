<svg viewBox="0 0 620 800" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="features-title features-description">
    <title id="features-title">TimePicker features</title>
    <desc id="features-description">Yii2 form integration, Bootstrap 3 through 5, configurable time formats and layouts, Krajee integration, and bundled assets.</desc>
    <style>
        text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .box-bg { fill: #e6f4ea; stroke: #a7cdb3; stroke-width: 1; }
        .title { font-weight: 700; font-size: 20px; fill: #1a202c; }
        .content { font-size: 16px; fill: #4a5568; }
    </style>

    <g>
        <rect class="box-bg" x="16" y="16" width="588" height="114" rx="6"/>
        <rect x="16" y="16" width="4" height="114" fill="#1f883d"/>
        <text class="title" x="32" y="47">Form Integration</text>
        <text class="content" x="32" y="79">Standalone inputs and model attributes</text>
        <text class="content" x="32" y="105">Use directly or through ActiveForm</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="146" width="588" height="114" rx="6"/>
        <rect x="16" y="146" width="4" height="114" fill="#1f883d"/>
        <text class="title" x="32" y="177">Bootstrap 3, 4 and 5</text>
        <text class="content" x="32" y="209">Version-specific markup and Yii asset bundles</text>
        <text class="content" x="32" y="235">Configure matching bsVersion settings and icons</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="276" width="588" height="114" rx="6"/>
        <rect x="16" y="276" width="4" height="114" fill="#1f883d"/>
        <text class="title" x="32" y="307">Flexible Time Formats</text>
        <text class="content" x="32" y="339">12-hour or 24-hour display with optional seconds</text>
        <text class="content" x="32" y="365">Set minute steps and default times</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="406" width="588" height="114" rx="6"/>
        <rect x="16" y="406" width="4" height="114" fill="#1f883d"/>
        <text class="title" x="32" y="437">Configurable Layouts</text>
        <text class="content" x="32" y="469">Custom addons, buttons and input sizes</text>
        <text class="content" x="32" y="495">Dropdown and inline input layouts</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="536" width="588" height="114" rx="6"/>
        <rect x="16" y="536" width="4" height="114" fill="#1f883d"/>
        <text class="title" x="32" y="567">Krajee Integration</text>
        <text class="content" x="32" y="599">Plugin options, events, disabled and readonly</text>
        <text class="content" x="32" y="625">Inherited input and asset configuration</text>
    </g>

    <g>
        <rect class="box-bg" x="16" y="666" width="588" height="114" rx="6"/>
        <rect x="16" y="666" width="4" height="114" fill="#1f883d"/>
        <text class="title" x="32" y="697">Bundled Assets</text>
        <text class="content" x="32" y="729">JavaScript and CSS shipped with the extension</text>
        <text class="content" x="32" y="755">Debug and minified files with asset overrides</text>
    </g>
</svg>
